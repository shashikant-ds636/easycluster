[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easycluster"
version = "0.1.0"
description = "A beginner-friendly, consistent API for K-Means and Agglomerative Clustering on pandas DataFrames."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Shashikant" }]
keywords = ["clustering", "kmeans", "hierarchical", "machine-learning", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/shashikantgiri/easycluster"
Issues = "https://github.com/shashikantgiri/easycluster/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
